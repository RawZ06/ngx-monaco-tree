name: Angular CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: |
          npm i -g pnpm
          pnpm install

      - name: Increment version
        if: github.ref == 'refs/heads/master'
        run: |
          cd projects/ngx-monaco-tree
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config user.name "$GITHUB_ACTOR"
          npm version minor -m "v%s"
          VERSION=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "Bump version to ${VERSION}"
          git tag 'v'${VERSION}
          git push "https://$GITHUB_ACTOR:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git"
          git push "https://$GITHUB_ACTOR:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" --follow-tags
          git push "https://$GITHUB_ACTOR:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" --tags

      - name: Update CHANGELOG with version
        if: github.ref == 'refs/heads/master'
        run: |
          cd projects/ngx-monaco-tree
          VERSION=$(node -p "require('./package.json').version")
          DATE=$(date +%Y-%m-%d)

          # Read the CHANGELOG
          CHANGELOG_FILE="CHANGELOG.md"

          # Replace "### Current" with "### X.Y.Z (DATE)" and add new Current section
          python3 << EOF
          import re
          from datetime import datetime

          version = "$VERSION"
          date = "$DATE"

          with open("$CHANGELOG_FILE", "r") as f:
              content = f.read()

          # Replace first occurrence of "### Current" with versioned section
          new_content = content.replace(
              "### Current\n",
              f"### {version} ({date})\n\n### Current\n",
              1
          )

          with open("$CHANGELOG_FILE", "w") as f:
              f.write(new_content)
          EOF

          # Commit and push the updated CHANGELOG
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config user.name "$GITHUB_ACTOR"
          git add CHANGELOG.md
          git commit -m "docs: Update CHANGELOG for release v${VERSION}"
          git push "https://$GITHUB_ACTOR:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git"

      - name: Build project
        run: pnpm run build ngx-monaco-tree

      - name: Publish NPM package
        if: github.ref == 'refs/heads/master'
        run: |
          cd dist/ngx-monaco-tree
          npm publish --access public

        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
